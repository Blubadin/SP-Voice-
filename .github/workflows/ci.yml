name: SportScout checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SportScout-Voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: SportScout-Voice/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:vercel
